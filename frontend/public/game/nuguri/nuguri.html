<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>너구리런</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
<style>
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#1d2230; font-family:'Jua',system-ui,sans-serif; }
  #app{ position:fixed; inset:0; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  #game{ position:absolute; inset:0; display:block; }

  /* ---------- HUD ---------- */
  #hud{ position:absolute; top:0; left:0; right:0; padding:max(12px,env(safe-area-inset-top)) 16px 0; display:flex; align-items:flex-start; justify-content:space-between; gap:10px; pointer-events:none; z-index:5; transition:opacity .25s; }
  #hud.hide{ opacity:0; }
  .hud-pill{ background:rgba(255,255,255,.82); backdrop-filter:blur(6px); border-radius:18px; padding:8px 12px; box-shadow:0 4px 0 rgba(80,60,100,.14), 0 8px 16px rgba(40,30,60,.12); display:flex; align-items:center; gap:8px; }
  #hearts{ display:flex; gap:6px; }
  .heart{ width:22px; height:20px; position:relative; }
  .heart::before,.heart::after{ content:''; position:absolute; width:11px; height:17px; border-radius:11px 11px 0 0; background:#ff7aa2; left:11px; top:0; transform:rotate(-45deg); transform-origin:0 100%; }
  .heart::after{ left:0; transform:rotate(45deg); transform-origin:100% 100%; }
  .heart.empty::before,.heart.empty::after{ background:#dcd5e4; }
  .hud-mid{ flex:1; max-width:440px; display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none; }
  .stage-label{ font-size:17px; color:#fff; text-shadow:0 2px 0 rgba(60,40,80,.35), 0 0 8px rgba(0,0,0,.2); letter-spacing:.5px; }
  .progress{ width:min(60vw,300px); height:12px; background:rgba(255,255,255,.55); border-radius:99px; position:relative; box-shadow:inset 0 1px 3px rgba(60,40,80,.25); }
  #progFill{ position:absolute; left:0; top:0; bottom:0; width:0%; background:linear-gradient(90deg,#7fe0c0,#5fcf9e); border-radius:99px; transition:width .12s linear; }
  #progMarker{ position:absolute; top:50%; width:18px; height:18px; transform:translate(-50%,-50%); transition:left .12s linear; }
  #progMarker::before{ content:''; position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle at 35% 30%,#e9eef5,#aeb8c6); box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .coinbox{ font-size:18px; color:#7a5a1e; }
  .coin-ico{ width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#ffe89a,#f4b431); box-shadow:inset 0 0 0 2px #d99520; display:inline-block; vertical-align:-3px; margin-right:5px; }
  #muteBtn,#pauseBtn{ pointer-events:auto; width:38px; height:38px; border:none; border-radius:14px; background:rgba(255,255,255,.82); box-shadow:0 4px 0 rgba(80,60,100,.14); cursor:pointer; font-size:18px; color:#6a6070; line-height:1; display:flex; align-items:center; justify-content:center; }
  #pauseBtn:active,#muteBtn:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(80,60,100,.14); }

  #tapHint{ position:absolute; left:50%; bottom:13%; transform:translateX(-50%); white-space:nowrap; color:#fff; background:rgba(40,32,60,.5); padding:10px 22px; border-radius:99px; font-size:clamp(17px,4.4vw,24px); text-shadow:0 2px 0 rgba(60,40,80,.4); z-index:4; pointer-events:none; animation:bob 1s ease-in-out infinite; }
  #tapHint.hide{ display:none; }
  @keyframes bob{ 0%,100%{ transform:translateX(-50%) translateY(0); } 50%{ transform:translateX(-50%) translateY(-8px); } }

  /* ---------- Screens ---------- */
  #screen{ position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(30,28,46,.42); backdrop-filter:blur(4px); }
  #screen.hide{ display:none; }
  .card{ background:#fffdf7; border-radius:30px; padding:30px 26px 28px; box-shadow:0 22px 55px rgba(40,28,60,.4); text-align:center; width:min(94vw,420px); animation:pop .35s cubic-bezier(.2,1.3,.5,1); }
  @keyframes pop{ from{ transform:scale(.85); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .title{ font-size:clamp(34px,9vw,48px); color:#4a4458; line-height:1.05; }
  .title .accent{ color:#ff8fb1; }
  .subtitle{ font-size:16px; color:#9089a0; margin-top:8px; line-height:1.5; }
  .big-emoji{ font-size:64px; margin-bottom:6px; }
  .stat-row{ display:flex; justify-content:center; gap:18px; margin:18px 0 4px; }
  .stat{ background:#f5f1ea; border-radius:18px; padding:12px 18px; min-width:88px; }
  .stat .n{ font-size:28px; color:#4a4458; }
  .stat .l{ font-size:13px; color:#9089a0; margin-top:2px; }
  .btn{ font-family:'Jua',sans-serif; white-space:nowrap; border:none; cursor:pointer; color:#fff; background:#ff8fb1; padding:15px 28px; border-radius:20px; font-size:21px; box-shadow:0 6px 0 #e06d92, 0 11px 16px rgba(60,30,50,.22); transition:transform .08s, box-shadow .08s; margin-top:8px; }
  .btn:active{ transform:translateY(5px); box-shadow:0 1px 0 #e06d92, 0 3px 8px rgba(60,30,50,.2); }
  .btn.green{ background:#5fcf9e; box-shadow:0 6px 0 #3aae7e, 0 11px 16px rgba(30,60,45,.22); }
  .btn.green:active{ box-shadow:0 1px 0 #3aae7e; }
  .btn.sky{ background:#6cc6ff; box-shadow:0 6px 0 #3fa0e0, 0 11px 16px rgba(30,50,70,.22); }
  .btn.sky:active{ box-shadow:0 1px 0 #3fa0e0; }
  .btn.ghost{ background:#ece7f1; color:#8a8298; box-shadow:0 5px 0 #d4cce0; font-size:18px; padding:12px 22px; }
  .btn.ghost:active{ box-shadow:0 1px 0 #d4cce0; }
  .btn-col{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:20px; }
  .btn-row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:18px; }

  .section-label{ font-size:14px; color:#b3aabd; margin:20px 0 10px; letter-spacing:1px; }
  .stage-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:9px; }
  .sbtn{ font-family:'Jua',sans-serif; aspect-ratio:1; border:none; border-radius:16px; font-size:20px; cursor:pointer; background:#ffd07e; color:#8a5a16; box-shadow:0 4px 0 #e8a945; transition:transform .07s, box-shadow .07s; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; line-height:1; padding:0; }
  .sbtn:active{ transform:translateY(3px); box-shadow:0 1px 0 #e8a945; }
  .sbtn.clear{ background:#9be3c0; color:#2c7d5a; box-shadow:0 4px 0 #5cc497; }
  .sbtn .srow{ font-size:11px; letter-spacing:1px; color:#f0a92e; }
  .sbtn.clear .srow .off{ color:#79c9a4; }
  .sbtn.locked{ background:#ece7f1; color:#c3bcce; box-shadow:0 4px 0 #d8d1e2; cursor:default; }
  .theme-name{ font-size:20px; color:#7a728a; margin-top:6px; }
  .clear-stars{ font-size:42px; letter-spacing:5px; color:#ffc24d; text-shadow:0 3px 0 rgba(200,140,20,.3); margin-top:4px; line-height:1; }
  .clear-stars .off{ color:#e7e0d2; text-shadow:none; }
</style>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="hud" class="hide">
      <div class="hud-pill"><div id="hearts"></div></div>
      <div class="hud-mid">
        <div class="stage-label" id="stageLabel">STAGE 1</div>
        <div class="progress"><div id="progFill"></div><div id="progMarker"></div></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <div class="hud-pill coinbox"><span class="coin-ico"></span><span id="coinCount">0</span></div>
        <button id="pauseBtn" aria-label="일시정지">❚❚</button>
      </div>
    </div>
    <div id="tapHint" class="hide">탭하면 점프!</div>
    <div id="screen" class="hide"></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
